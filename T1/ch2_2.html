<!-- intialiaze 2 variable and increment the variable each time and display the addition of both at a interval of 1 sec -->


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let a = 2,b=5;  
        test=setInterval(function(){
            document.getElementById("p1").innerHTML = ++a + ++b;
        },1000)
        function stop(){
            clearInterval(test)
        }
    </script>
</head>
<body>
    <p id = "p1"></p>
    <button onclick="stop()">STOP</button>
</body>
</html>
